<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Diaspora Community | RHND</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-section { padding: 60px 0; background: var(--bg-light); }
        .form-container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--primary-green); }
        .form-container h2 { text-align: center; color: var(--primary-green); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-family: inherit; }
        .form-control:focus { border-color: var(--primary-green); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .section-title { font-size: 1.2rem; color: var(--secondary-blue); border-bottom: 2px solid var(--primary-gold); padding-bottom: 10px; margin: 30px 0 20px; }
        @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Simple Header -->
    <header class="main-header" style="padding: 10px 0;">
        <div class="container header-inner" style="justify-content: center;">
            <a href="index.html" class="logo-section">
                <div class="logo" style="width: 50px; height: 50px;">RHND</div>
                <div class="logo-text">
                    <h1 style="font-size: 1.2rem;">RENEWED HOPE</h1>
                    <h2 style="font-size: 1rem;">NIGERIA DIASPORA</h2>
                </div>
            </a>
        </div>
    </header>

    <section class="form-section">
        <div class="container">
            <div class="form-container">
                <h2>Join Our Diaspora Community</h2>
                <form action="member-dashboard.html">
                    <h3 class="section-title">Personal Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter full name" required>
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender</label>
                            <select class="form-control" required>
                                <option>Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" class="form-control" placeholder="+X XXX XXX XXXX" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <h3 class="section-title">Diaspora Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Country of Residence</label>
                            <select class="form-control" required>
                                <option>Select Country</option>
                                <option>Saudi Arabia</option>
                                <option>United Kingdom</option>
                                <option>USA</option>
                                <option>UAE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Occupation / Business</label>
                            <input type="text" class="form-control" placeholder="Your profession" required>
                        </div>
                    </div>

                    <h3 class="section-title">Nigeria Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>State of Origin</label>
                            <input type="text" class="form-control" placeholder="E.g., Kano, Lagos" required>
                        </div>
                        <div class="form-group">
                            <label>LGA of Origin</label>
                            <input type="text" class="form-control" placeholder="Enter LGA" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 30px;">
                        <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Register & Generate ID</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
