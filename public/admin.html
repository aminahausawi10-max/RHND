<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHND CMS | News Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: var(--bg-light);">
    <header class="main-header">
        <div class="container header-inner" style="justify-content: space-between;">
            <div class="logo-section">
                <div class="logo-text">
                    <h1>RHND Admin</h1>
                    <h2>Content Management Portal</h2>
                </div>
            </div>
            <div>
                <a href="index.html" class="btn btn-secondary">Back to Website</a>
            </div>
        </div>
    </header>

    <div class="container section-padding">
        <div class="cards-grid" style="grid-template-columns: 1fr;">
            
            <div class="update-card" style="padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <h3 style="color: var(--secondary-dark-green); border-bottom: 2px solid var(--primary-gold); padding-bottom: 10px; margin-bottom: 25px;">Publish New Update</h3>
                <form id="add-post-form">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #555;">News Title</label>
                        <input type="text" id="post-title" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-family: inherit;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #555;">News Content</label>
                        <textarea id="post-content" required rows="6" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-family: inherit; resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="font-size: 1rem;"><i class="fas fa-paper-plane"></i> Publish to Website</button>
                    <span id="post-status" style="margin-left: 15px; color: var(--primary-green); font-weight: bold; display: none;">Successfully Published!</span>
                </form>
            </div>

            <div class="update-card" style="padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 30px;">
                <h3 style="color: var(--secondary-dark-green); border-bottom: 2px solid var(--primary-gold); padding-bottom: 10px; margin-bottom: 25px;">Manage Existing Content</h3>
                <div id="posts-list">
                    <p style="color: #666;">Loading content...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Very basic simple auth prompt for the static admin page
        let adminPwd = sessionStorage.getItem('rhnd_admin_pwd');
        if (!adminPwd) {
            adminPwd = prompt("Welcome to the Admin Portal!\\nPlease enter the Admin Password:");
            sessionStorage.setItem('rhnd_admin_pwd', adminPwd);
        }
        
        const fetchHeaders = {
            'Content-Type': 'application/json',
            'X-Admin-Password': adminPwd
        };

        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const list = document.getElementById('posts-list');
                
                if (posts.length === 0) {
                    list.innerHTML = '<p style="color: #666;">No news published yet.</p>';
                    return;
                }
                
                list.innerHTML = posts.map(post => `
                    <div style="border-bottom: 1px solid #e2e8f0; padding: 20px 0; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h4 style="margin: 0 0 8px 0; font-size: 1.2rem; color: #333;">${post.title}</h4>
                            <small style="color: #718096; font-weight: 600;"><i class="far fa-calendar-alt"></i> ${new Date(post.created_at).toLocaleString()}</small>
                        </div>
                        <button onclick="deletePost(${post.id})" class="btn" style="background: #e53e3e; color: white; padding: 8px 16px;"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('posts-list').innerHTML = '<p style="color: red;">Error loading posts.</p>';
            }
        }
        
        async function deletePost(id) {
            if(!confirm('Are you absolutely sure you want to delete this update?')) return;
            const res = await fetch('/api/posts?id=' + id, { method: 'DELETE', headers: fetchHeaders });
            if (res.status === 401) {
                alert("Incorrect Admin Password! You don't have permission to delete.");
                sessionStorage.removeItem('rhnd_admin_pwd');
                window.location.reload();
                return;
            }
            fetchPosts();
        }
        
        document.getElementById('add-post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const status = document.getElementById('post-status');
            
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: fetchHeaders,
                body: JSON.stringify({title, content})
            });
            
            if (res.status === 401) {
                alert("Incorrect Admin Password! You don't have permission to publish.");
                sessionStorage.removeItem('rhnd_admin_pwd');
                window.location.reload();
                return;
            }
            
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            status.style.display = 'inline';
            setTimeout(() => status.style.display = 'none', 3000);
            fetchPosts();
        });
        
        fetchPosts();
    </script>
</body>
</html>
