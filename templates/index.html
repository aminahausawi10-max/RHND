<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>RHND Dashboard</title>
    <!-- Tabler Core CDN for professional UI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
    <style>
      .view-container { display: none; }
    </style>
  </head>
  <body class="theme-light">
    <div class="page">
      <!-- Sidebar -->
      <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
            <span class="navbar-toggler-icon"></span>
          </button>
          <h1 class="navbar-brand navbar-brand-autodark">
            <a href="#">RHND Platform</a>
          </h1>
          <div class="collapse navbar-collapse" id="sidebar-menu">
            <ul class="navbar-nav pt-lg-3">
              <li class="nav-item">
                <a class="nav-link nav-link-custom" data-target="dashboard" style="cursor:pointer;">
                  <span class="nav-link-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><polyline points="5 12 3 12 12 3 21 12 19 12" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>
                    Dashboard
                  </span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link nav-link-custom" data-target="login" style="cursor:pointer;">
                  <span class="nav-link-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" /><path d="M20 12h-13l3 -3m0 6l-3 -3" /></svg>
                    Login
                  </span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link nav-link-custom" data-target="register" style="cursor:pointer;">
                  <span class="nav-link-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="9" cy="7" r="4" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 11h6m-3 -3v6" /></svg>
                    Register
                  </span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <div class="page-wrapper">
        <!-- Page header -->
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <h2 class="page-title">Welcome to RHND</h2>
              </div>
              <div class="col-auto ms-auto d-print-none">
                <div id="user-info" class="text-muted">Not logged in</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Page body -->
        <div class="page-body">
          <div class="container-xl">
            
            <!-- Login View -->
            <section id="login-view" class="view-container">
              <div class="row justify-content-center mt-5">
                <div class="col-md-6 col-lg-5">
                  <form class="card card-md shadow-sm" id="login-form">
                    <div class="card-body">
                      <h2 class="card-title text-center mb-4">Login to your account</h2>
                      <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="login-email" placeholder="Enter email" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                      </div>
                      <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </section>

            <!-- Register View -->
            <section id="register-view" class="view-container">
              <div class="row justify-content-center mt-5">
                <div class="col-md-6 col-lg-5">
                  <form class="card card-md shadow-sm" id="register-form">
                    <div class="card-body">
                      <h2 class="card-title text-center mb-4">Create new account</h2>
                      <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="Enter name" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="Enter email" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Password" required>
                      </div>
                      <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">Create new account</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </section>

            <!-- Dashboard View -->
            <section id="dashboard-view" class="view-container">
              <div class="row row-cards">
                <div class="col-md-12">
                  <div class="card shadow-sm">
                    <div class="card-header">
                      <h3 class="card-title">Create New Post</h3>
                    </div>
                    <div class="card-body">
                      <form id="create-post-form">
                        <div class="mb-3">
                          <label class="form-label">Title</label>
                          <input type="text" class="form-control" id="post-title" placeholder="Post Title" required>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Content</label>
                          <textarea class="form-control" id="post-content" rows="3" placeholder="What's on your mind?" required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">Post</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>

              <div class="hr-text mt-5 mb-4">Recent Posts</div>
              <div class="row row-cards" id="posts-container">
                <!-- Posts dynamically inserted here -->
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
