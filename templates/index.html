<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHND Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --primary-color: #007bff;
            --sidebar-bg: #343a40;
            --sidebar-text: #fff;
            --card-bg: #fff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 1rem;
        }
        
        .sidebar h2 { margin-bottom: 2rem; font-size: 1.5rem; }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 1rem; }
        .sidebar a { color: var(--sidebar-text); text-decoration: none; cursor: pointer; }
        
        .main-content {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            padding: 0.5rem 1rem; background: var(--primary-color); color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        
        .view-container { display: none; }
        
        .post-card h4 { margin-bottom: 0.5rem; }
        .post-card small { color: #666; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>RHND App</h2>
        <ul>
            <li><a class="nav-link" data-target="dashboard">Dashboard</a></li>
            <li><a class="nav-link" data-target="login">Login</a></li>
            <li><a class="nav-link" data-target="register">Register</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <h1>RHND Platform</h1>
            <div id="user-info" class="user-info">Not logged in</div>
        </header>
        
        <!-- Login View -->
        <section id="login-view" class="view-container">
            <div class="card" style="max-width: 400px; margin: 0 auto;">
                <h2>Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit">Log In</button>
                </form>
            </div>
        </section>
        
        <!-- Register View -->
        <section id="register-view" class="view-container">
            <div class="card" style="max-width: 400px; margin: 0 auto;">
                <h2>Register</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="reg-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
        </section>
        
        <!-- Dashboard View -->
        <section id="dashboard-view" class="view-container">
            <div class="card">
                <h3>Create New Post</h3>
                <form id="create-post-form">
                    <div class="form-group">
                        <input type="text" id="post-title" placeholder="Title" required>
                    </div>
                    <div class="form-group">
                        <textarea id="post-content" placeholder="Content" rows="3" required></textarea>
                    </div>
                    <button type="submit">Post</button>
                </form>
            </div>
            
            <h3>Recent Posts</h3>
            <div id="posts-container">
                <!-- Posts loaded dynamically -->
            </div>
        </section>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
